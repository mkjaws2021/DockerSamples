services:
  app:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
    depends_on:
      - db
    networks:
      - config-store-net
    command: npm run dev
  db: 
    image: postgres:17.1
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
    networks:
      - config-store-net      
networks:
  config-store-net:

volumes:
  postgres-data:

